services:
  # 1. Database (MongoDB)
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Backend (Server)
  backend:
    build: .
    ports:
      - "5001:5000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/social-media
      - PORT=5000
    depends_on:
      - mongo

  # 3. Frontend (Client)
  frontend:
    build: ./client
    ports:
      - "3001:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mongo-data:
