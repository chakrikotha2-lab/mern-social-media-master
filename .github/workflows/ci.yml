name: Frontend CI

on:
  push:
    branches: [dev]
    paths:
      - 'client/**'

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend
        run: |
          cd client
          npm install

      - name: Build frontend
        run: |
          cd client
          npm run build || echo "skip build"
