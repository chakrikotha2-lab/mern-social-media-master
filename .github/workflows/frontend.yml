name: MERN CI (Dev - Single Pipeline)

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install Backend (root)
      - name: Install backend dependencies
        run: npm install

      # Step 4: Build Backend (if exists)
      - name: Build backend
        run: npm run build --if-present

      # Step 5: Install Frontend
      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      # Step 6: Build Frontend
      - name: Build frontend
        run: |
          cd client
          npm run build --if-present
