name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger pipeline when changes are pushed to the 'main' branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Log in to Docker Hub using your Docker credentials
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t chakri/my-app:${{ github.sha }} .

      # Step 5: Push the Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push chakri/my-app:${{ github.sha }}

      # Step 6: Optional: You can add a step to deploy the image if needed
