name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the 'main' branch

jobs:
  build:
    runs-on: ubuntu-latest  # Run the job on the latest Ubuntu machine
    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx (for advanced builds, optional but recommended)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Log in to Docker Hub using GitHub secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Docker username from secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # Docker password from secrets

      # Step 4: Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG="chakri/training-service:${{ github.sha }}"  # Tag with commit SHA
          docker build -t $IMAGE_TAG .

      # Step 5: Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          IMAGE_TAG="chakri/training-service:${{ github.sha }}"
          docker push $IMAGE_TAG
